<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Analytics preferences — Fernando</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell" style="padding-block:80px;max-width:760px">
    <h1>Analytics preferences</h1>
    <p>Exclude your visits on this browser from the portfolio’s page-view statistics. This preference applies only to this website and browser. Clearing browser storage resets it.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <button class="button button-lime" id="exclude" type="button">Exclude my visits</button>
    <button class="button" id="include" type="button">Count my visits again</button>
    <p><a href="./index.html">Return to portfolio</a></p>
    <noscript>Enable JavaScript to save this preference.</noscript>
  </main>
  <script src="./analytics-preferences.js" defer></script>
</body>
</html>
